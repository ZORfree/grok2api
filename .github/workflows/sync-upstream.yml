name: Sync Upstream & Release

on:
  schedule:
    # 每天北京时间 08:00 检查一次 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: '强制发布（即使没有新版本）'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 使用 PAT 以便能推送包含 workflow 文件变更的 commits/tags
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/chenyme/grok2api.git
          git fetch upstream main --tags

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          FORK_SHA=$(git rev-parse HEAD)
          if [ "$UPSTREAM_SHA" = "$FORK_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits."
          fi

      - name: Merge upstream changes
        id: sync
        if: steps.check.outputs.changed == 'true' || inputs.force_release == 'true'
        run: |
          git merge upstream/main --no-edit --allow-unrelated-histories
          git push origin main
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Set synced=false output
        if: steps.check.outputs.changed == 'false' && inputs.force_release != 'true'
        run: |
          echo "synced=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Fork is already up-to-date with upstream."

      - name: Read VERSION
        id: version
        if: steps.sync.outputs.synced == 'true' || inputs.force_release == 'true'
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Sync upstream tags
        if: steps.sync.outputs.synced == 'true'
        run: |
          git fetch upstream --tags
          git push origin --tags --force

  release:
    name: Build & Release
    needs: sync
    if: needs.sync.outputs.synced == 'true' || github.event.inputs.force_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.sync.outputs.version }}
    secrets: inherit
